; GIGAFLOW-inspired PufferDrive training configuration with the implemented
; advantage filtering and per-agent randomization enabled.
;
; Launch with: puffer train puffer_drive_gigaflow_randomized

[base]
package = ocean
env_name = puffer_drive_gigaflow_randomized
policy_name = Drive
rnn_name = Recurrent

[vec]
; PufferDrive is native internally, but PPO still requires PufferLib's outer
; vector wrapper to provide rollout batching and agents_per_batch.
backend = Multiprocessing
num_envs = 1
num_workers = 1
batch_size = 1

[policy]
input_size = 64
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[env]
; 250 agents x 128 BPTT steps = the paper's 32,000 samples/GPU rollout.
; This is necessarily much smaller than GIGAFLOW's 4,800 worlds/GPU.
num_agents = 250
; The paper uses 12 discrete longitudinal/lateral jerk actions.
action_type = discrete
; Required for GIGAFLOW-style per-agent dynamics randomization.
dynamics_model = jerk
; Samples throttle/steer gains from X(1.25) and acceleration/speed limits
; from X(1.5) for each controlled agent at every episode reset.
dynamics_randomization = True
; Samples a vehicle embodiment per controlled vehicle at reset. This uses
; PufferDrive's representative fixed classes, not the paper's continuous range.
embodiment_randomization = True
embodiment_clearance = 0.20
; Adds GIGAFLOW reward conditions to the ego observation and samples their
; supported Table A2 ranges independently for each agent at episode reset.
reward_model = gigaflow
reward_randomization = True
reward_vehicle_collision = -0.5
reward_offroad_collision = -0.5
dt = 0.3
reward_goal = 1.0
reward_goal_post_respawn = 0.25
goal_radius = 2.0
goal_speed = 100.0
goal_behavior = 1
goal_target_distance = 30.0
collision_behavior = 0
offroad_behavior = 0
episode_length = 1200
resample_frequency = 1200
termination_mode = 0
map_dir = "resources/drive/binaries"
num_maps = 1000
init_steps = 0
control_mode = "control_vehicles"
init_mode = "create_all_valid"
; Used by the native simulator as well as the Python trainer.
ini_file = "pufferlib/config/gigaflow/drive_randomized.ini"

[train]
seed = 42
torch_deterministic = True
cpu_offload = False
device = cuda
optimizer = adam
anneal_lr = True
; PufferLib supports bfloat16 autocast rather than the paper's FP16 AMP.
precision = bfloat16
; Per rank. Eight DDP ranks therefore collect one trillion transitions total.
total_timesteps = 125_000_000_000
learning_rate = 0.0005
gamma = 0.999
gae_lambda = 0.95
update_epochs = 3
clip_coef = 0.2
vf_coef = 0.5
; PufferLib's value clipping is not disabled independently; use a large value
; to make clipping inactive for normal value targets.
vf_clip_coef = 1_000_000.0
max_grad_norm = 0.5
ent_coef = 0.01
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
; 32,000 samples/rank x 8 ranks = GIGAFLOW's 256,000 global PPO batch.
batch_size = 32000
minibatch_size = 32000
max_minibatch_size = 32000
bptt_horizon = 128
compile = False
compile_mode = max-autotune-no-cudagraphs
compile_fullgraph = True
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
; Algorithm 1: retain transitions with |GAE| >= 1% of the EWMA maximum.
advantage_filtering = True
advantage_filter_threshold_scale = 0.01
advantage_filter_ema_decay = 0.25
checkpoint_interval = 1000
render = False
render_interval = 1000
obs_only = True
show_grid = True
show_lasers = False
show_human_logs = False
zoom_in = True
render_map = none

[eval]
eval_interval = 1000
map_dir = "resources/drive/binaries"
wosac_num_maps = 20
backend = PufferEnv
wosac_realism_eval = False
wosac_num_rollouts = 32
wosac_init_steps = 10
wosac_control_mode = "control_wosac"
wosac_init_mode = "create_all_valid"
wosac_goal_behavior = 2
wosac_goal_radius = 2.0
wosac_sanity_check = False
wosac_aggregate_results = True
human_replay_eval = False
human_replay_control_mode = "control_sdc_only"
