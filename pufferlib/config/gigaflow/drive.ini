; GIGAFLOW-inspired PufferDrive training configuration.
;
; This preserves PufferDrive's world, policy, and available reward/dynamics
; settings. It maps only the paper's disclosed training scale and PPO settings.
; Launch with: puffer train puffer_drive_gigaflow

[base]
package = ocean
env_name = puffer_drive_gigaflow
policy_name = Drive
rnn_name = Recurrent

[vec]
; Each DDP rank owns one native, internally vectorized PufferDrive instance.
backend = PufferEnv
num_envs = 1
num_workers = 1
batch_size = 1

[policy]
input_size = 64
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[env]
; 250 agents x 128 BPTT steps = the paper's 32,000 samples/GPU rollout.
; This is necessarily much smaller than GIGAFLOW's 4,800 worlds/GPU.
num_agents = 250
action_type = discrete
dynamics_model = classic
reward_vehicle_collision = -0.5
reward_offroad_collision = -0.5
dt = 0.3
reward_goal = 1.0
reward_goal_post_respawn = 0.25
goal_radius = 2.0
goal_speed = 100.0
goal_behavior = 1
goal_target_distance = 30.0
collision_behavior = 0
offroad_behavior = 0
episode_length = 1200
resample_frequency = 1200
termination_mode = 0
map_dir = "resources/drive/binaries/training"
num_maps = 10000
init_steps = 0
control_mode = "control_vehicles"
init_mode = "create_all_valid"
; Used by the native simulator as well as the Python trainer.
ini_file = "pufferlib/config/gigaflow/drive.ini"

[train]
seed = 42
torch_deterministic = True
cpu_offload = False
device = cuda
optimizer = adam
anneal_lr = True
; PufferLib supports bfloat16 autocast rather than the paper's FP16 AMP.
precision = bfloat16
; Per rank. Eight DDP ranks therefore collect one trillion transitions total.
total_timesteps = 125_000_000_000
learning_rate = 0.0005
gamma = 0.999
gae_lambda = 0.95
update_epochs = 3
clip_coef = 0.2
vf_coef = 0.5
; PufferLib's value clipping is not disabled independently; use a large value
; to make clipping inactive for normal value targets.
vf_clip_coef = 1_000_000.0
max_grad_norm = 0.5
ent_coef = 0.01
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
; 32,000 samples/rank x 8 ranks = GIGAFLOW's 256,000 global PPO batch.
batch_size = 32000
minibatch_size = 32000
max_minibatch_size = 32000
bptt_horizon = 128
compile = False
compile_mode = max-autotune-no-cudagraphs
compile_fullgraph = True
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
; These are PufferLib's existing priority controls, not GIGAFLOW advantage
; filtering. Enable/configure the latter only once your branch exposes it.
prio_alpha = 0.85
prio_beta0 = 0.85
checkpoint_interval = 1000
render = False
render_interval = 1000
obs_only = True
show_grid = True
show_lasers = False
show_human_logs = False
zoom_in = True
render_map = none

[eval]
eval_interval = 1000
map_dir = "resources/drive/binaries/training"
wosac_num_maps = 20
backend = PufferEnv
wosac_realism_eval = False
wosac_num_rollouts = 32
wosac_init_steps = 10
wosac_control_mode = "control_wosac"
wosac_init_mode = "create_all_valid"
wosac_goal_behavior = 2
wosac_goal_radius = 2.0
wosac_sanity_check = False
wosac_aggregate_results = True
human_replay_eval = False
human_replay_control_mode = "control_sdc_only"
