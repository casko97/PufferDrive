[base]
package = ocean
env_name = puffer_drive
policy_name = Drive
rnn_name = None

[vec]
backend = PufferEnv
num_envs = 1
num_workers = 1
batch_size = 1
seed = 42
zero_copy = False

[policy]
input_size = 64
hidden_size = 256

[env]
num_agents = 1
action_type = trajectory
dynamics_model = classic
reward_vehicle_collision = -0.5
reward_offroad_collision = -0.5
dt = 0.1
reward_goal = 1.0
reward_goal_post_respawn = 0.25
goal_radius = 2.0
goal_speed = 100.0
goal_behavior = 2
goal_target_distance = 30.0
goal_at_gt_traj_end = true
collision_behavior = 1
offroad_behavior = 1
episode_length = 91
resample_frequency = 910
termination_mode = 1
map_dir = "datasets/nuplanCarBostonAll_validation"
num_maps = 1
scenario_filter = "all"
scenario_filter_threshold_deg = 45.0
scenario_filter_manifest_path = none
init_steps = 0
control_mode = "control_sdc_only"
observation_mode = "trajectory_history_32"
sdc_runtime_truck_override = false
init_mode = "create_all_valid"
trajectory_lookahead_distance = 6.0
trajectory_accel_gain = 1.0
trajectory_steer_gain = 1.0
trajectory_tracker_type = "stanley"
trajectory_stanley_gain = 0.5
trajectory_stanley_softening = 0.5
trajectory_smoothing_window = 1
trajectory_smoothing_blend = 0.0

[train]
device = "cpu"
compile = false
render = false

[eval]
backend = PufferEnv
eval_interval = 1
map_dir = "datasets/nuplanCarBostonAll_validation"
wosac_num_maps = 1
wosac_realism_eval = False
wosac_num_rollouts = 1
wosac_init_steps = 10
wosac_control_mode = "control_wosac"
wosac_init_mode = "create_all_valid"
wosac_goal_behavior = 2
wosac_goal_radius = 2.0
wosac_sanity_check = False
wosac_aggregate_results = True
human_replay_eval = True
human_replay_control_mode = "control_sdc_only"
