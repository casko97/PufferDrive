[base]
package = ocean
env_name = puffer_drive
policy_name = Drive
rnn_name = Recurrent

[vec]
backend = Multiprocessing
num_workers = 16
num_envs = 16
batch_size = auto
seed = 42
zero_copy = True

[policy]
input_size = 64
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[env]
num_agents = 1024
action_type = discrete
dynamics_model = classic
reward_vehicle_collision = -0.5
reward_offroad_collision = -0.2
dt = 0.1
reward_goal = 1.0
reward_goal_post_respawn = 0.5
goal_radius = 2.0
goal_speed = 20.0
goal_behavior = 0
goal_target_distance = 10.0
collision_behavior = 0
offroad_behavior = 0
episode_length = 91
resample_frequency = 91
termination_mode = 1
map_dir = "resources/drive/binaries/training"
num_maps = 1
init_steps = 0
control_mode = "control_vehicles"
observation_mode = "default"
sdc_runtime_truck_override = True
init_mode = "create_all_valid"

[train]
seed = 42
total_timesteps = 3000000000
anneal_lr = True
batch_size = auto
minibatch_size = 11648
max_minibatch_size = 32768
bptt_horizon = 91
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
clip_coef = 0.2
ent_coef = 0.001
gae_lambda = 0.95
gamma = 0.98
learning_rate = 0.001
max_grad_norm = 1
prio_alpha = 0.8499999999999999
prio_beta0 = 0.8499999999999999
update_epochs = 1
vf_clip_coef = 0.1999999999999999
vf_coef = 2
vtrace_c_clip = 1
vtrace_rho_clip = 1
checkpoint_interval = 1000
compile = False
compile_fullgraph = true
compile_mode = "max-autotune-no-cudagraphs"
cpu_offload = False
data_dir = "experiments"
device = "cuda"
obs_only = True
optimizer = "muon"
precision = "float32"
project = "ablations"
render = True
render_interval = 1000
render_map = none
show_grid = True
show_human_logs = False
show_lasers = False
torch_deterministic = True
zoom_in = True

[eval]
eval_interval = 1000
map_dir = "resources/drive/binaries/validation"
; Match the prior packaged baseline eval behavior by sampling 100 maps from the
; full validation pool with seed 42 via the launcher flags.
wosac_num_maps = 10000
backend = PufferEnv
wosac_realism_eval = False
wosac_num_rollouts = 32
wosac_init_steps = 10
wosac_control_mode = "control_wosac"
wosac_init_mode = "create_all_valid"
wosac_goal_behavior = 2
wosac_goal_radius = 2.0
wosac_sanity_check = False
wosac_aggregate_results = True
human_replay_eval = True
human_replay_control_mode = "control_sdc_only"
