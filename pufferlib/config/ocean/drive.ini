[base]
package = ocean
env_name = puffer_drive
policy_name = Drive
rnn_name = Recurrent

[vec]
backend = Multiprocessing
num_workers = 6
num_envs = 6
batch_size = 3
seed = 42
zero_copy = True

[policy]
input_size = 64
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[env]
num_agents = 1
action_type = discrete
; Available action_type values:
; - discrete: existing joint discrete control
; - continuous: existing low-level continuous control
; - trajectory: policy outputs 32 future steps x 5 features flattened to 160 dims
dynamics_model = classic
reward_vehicle_collision = -0.5
reward_offroad_collision = -0.5
dt = 0.1
reward_goal = 1.0
reward_goal_post_respawn = 0.25
goal_radius = 2.0
goal_speed = 100.0
goal_behavior = 2
goal_target_distance = 30.0
collision_behavior = 1
offroad_behavior = 1
episode_length = 91
resample_frequency = 910
termination_mode = 1
map_dir = "resources/drive/binaries/training"
num_maps = 10000
scenario_filter = "all"
scenario_filter_threshold_deg = 45.0
scenario_filter_manifest_path = none
init_steps = 0
control_mode = "control_sdc_only"
observation_mode = "default"
; Available observation_mode values:
; - default
; - sdc_only_with_trailer
; - trajectory_history_32 (current observation plus 3.2s history in newest ego frame)
; - trajectory_history_32_sdc_only_with_trailer (trajectory history with ego trailer pose/type context)
sdc_runtime_truck_override = false
init_mode = "create_all_valid"

[train]
seed = 42
total_timesteps = 2000000000
anneal_lr = True
batch_size = 393216
minibatch_size = 24576
max_minibatch_size = 32768
bptt_horizon = 32
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
clip_coef = 0.2
ent_coef = 0.005
gae_lambda = 0.95
gamma = 0.98
learning_rate = 0.003
max_grad_norm = 1
prio_alpha = 0.8499999999999999
prio_beta0 = 0.8499999999999999
update_epochs = 1
vf_clip_coef = 0.1999999999999999
vf_coef = 2
vtrace_c_clip = 1
vtrace_rho_clip = 1
checkpoint_interval = 1000
compile = false
compile_fullgraph = true
compile_mode = "max-autotune-no-cudagraphs"
cpu_offload = false
data_dir = "experiments"
device = "cuda"
obs_only = true
optimizer = "muon"
precision = "float32"
project = "ablations"
render = true
render_interval = 1000
show_grid = True
show_lasers = False
show_human_logs = False
torch_deterministic = true
zoom_in = True
render_map = none

[eval]
eval_interval = 1000
map_dir = "resources/drive/binaries/validation"
; Match the apricot baseline human replay eval behavior by sampling 100 maps
; from the full validation pool via the launcher flags.
wosac_num_maps = 10000
backend = PufferEnv
wosac_realism_eval = False
wosac_num_rollouts = 32
wosac_init_steps = 10
wosac_control_mode = "control_wosac"
wosac_init_mode = "create_all_valid"
wosac_goal_behavior = 2
wosac_goal_radius = 2.0
wosac_sanity_check = False
wosac_aggregate_results = True
human_replay_eval = True
human_replay_control_mode = "control_sdc_only"

[preference_reward]
enabled = false
model_dir = "outputs/reward_model/boston_all_90_10"
checkpoint_stem = "offline_truck_context"
beta = 0.1
lambda_uncertainty = 0.0
normalize_mode = "zscore_baseline"
scale = 1.0
clip_min = -1.0
clip_max = 1.0
warmup_steps = 0
calibration_steps = 10000
log_member_stats = false
strict_observation_match = true

[sweep.train.learning_rate]
distribution = log_normal
min = 0.001
mean = 0.003
max = 0.005
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.001
mean = 0.005
max = 0.03
scale = auto

[sweep.train.gamma]
distribution = log_normal
min = 0.97
mean = 0.98
max = 0.999
scale = auto

[sweep.train.gae_lambda]
distribution = log_normal
min = 0.95
mean = 0.98
max = 0.999
scale = auto

[controlled_exp.train.goal_speed]
values = [10, 20, 30, 3]

[controlled_exp.train.ent_coef]
values = [0.001, 0.005, 0.01]

[controlled_exp.train.seed]
values = [42, 55, 1]
