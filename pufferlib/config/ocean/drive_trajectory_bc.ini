[base]
package = ocean
env_name = puffer_drive
policy_name = Drive

[policy]
input_size = 64
hidden_size = 256

[env]
action_type = trajectory
observation_mode = "trajectory_history_32"
dynamics_model = classic
dt = 0.1
episode_length = 91
init_steps = 0
init_mode = "create_all_valid"
control_mode = "control_sdc_only"
goal_behavior = 2
goal_target_distance = 30.0
goal_radius = 2.0
goal_speed = 100.0
collision_behavior = 0
offroad_behavior = 0
termination_mode = 1

[bc_train]
dataset_dir = "datasets/nuplanCarBostonAll_training"
val_dataset_dir = "datasets/nuplanCarBostonAll_validation"
output_dir = "experiments_bc/drive_trajectory_bc_nuplanCarBostonAll_training"
device = "auto"
epochs = 20
batch_size = 256
learning_rate = 0.003
weight_decay = 0.0
num_workers = 0
val_fraction = 0.0
max_maps = -1
max_val_maps = -1
save_best = true
log_interval = 25
seed = 42
grad_clip_norm = 1.0
max_train_samples_per_epoch = -1
max_val_samples = -1
; Require the full 32-step history and prediction windows. Base anchors are
; spaced by ~1s at dt=0.1; turning maps can be sampled more densely below.
sample_stride = 10
sample_start_offset = 31
sample_end_offset = 31
require_full_windows = true
turning_sample_stride = 1
turning_threshold_deg = 45.0
turning_manifest_path = none
wandb = true
wandb_project = "pufferdrive_bc"
wandb_group = "trajectory_bc"
wandb_name = "nuplanCarBostonAll_trajectory_bc"
wandb_tag = "nuplanCarBostonAll"
wandb_resume_id = none
