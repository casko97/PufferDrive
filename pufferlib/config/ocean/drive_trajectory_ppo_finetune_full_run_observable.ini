[base]
package = ocean
env_name = puffer_drive
policy_name = Drive
rnn_name = None

[vec]
backend = Multiprocessing
num_workers = 4
num_envs = 4
batch_size = 4
seed = 42
zero_copy = True

[policy]
input_size = 64
hidden_size = 256
initial_std_bias = -2.0
min_action_std = 0.01
max_action_std = 0.2

[env]
num_agents = 1
action_type = trajectory
dynamics_model = classic
reward_vehicle_collision = -0.5
reward_offroad_collision = -0.5
dt = 0.1
reward_goal = 1.0
reward_goal_post_respawn = 0.25
goal_radius = 2.0
goal_speed = 100.0
goal_behavior = 2
goal_target_distance = 30.0
goal_at_gt_traj_end = true
collision_behavior = 1
offroad_behavior = 1
episode_length = 91
resample_frequency = 910
termination_mode = 1
map_dir = "datasets/nuplanCarBostonAll_training"
num_maps = 35687
scenario_filter = "all"
scenario_filter_threshold_deg = 45.0
scenario_filter_manifest_path = none
init_steps = 0
control_mode = "control_sdc_only"
observation_mode = "trajectory_history_32"
sdc_runtime_truck_override = false
init_mode = "create_all_valid"
trajectory_lookahead_distance = 6.0
trajectory_accel_gain = 1.2
trajectory_steer_gain = 1.0
trajectory_tracker_type = "stanley"
trajectory_stanley_gain = 0.4
trajectory_stanley_softening = 0.5
trajectory_smoothing_window = 1
trajectory_smoothing_blend = 0.0
trajectory_control_substeps = 5
substep_expert_interpolation = false
trajectory_history_warmstart_seconds = 3.2
terminate_on_stop = true

[train]
seed = 42
total_timesteps = 100000000
anneal_lr = True
batch_size = 16384
minibatch_size = 4096
max_minibatch_size = 4096
bptt_horizon = 1
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
clip_coef = 0.2
ent_coef = 0.0001
gae_lambda = 0.95
gamma = 0.98
learning_rate = 0.0001
max_grad_norm = 1
prio_alpha = 0.85
prio_beta0 = 0.85
update_epochs = 1
vf_clip_coef = 0.2
vf_coef = 2
vtrace_c_clip = 1
vtrace_rho_clip = 1
checkpoint_interval = 5
compile = false
compile_fullgraph = true
compile_mode = "max-autotune-no-cudagraphs"
cpu_offload = false
data_dir = "experiments_ppo_full_observable"
device = "cpu"
obs_only = true
optimizer = "adam"
precision = "float32"
project = "pufferdrive_bc_ppo_full_observable"
render = false
render_interval = 1000
torch_deterministic = true
trajectory_training_mode = "ppo_finetune"
trajectory_reinit_value_head = false
trajectory_freeze_backbone = true
trajectory_freeze_actor_head = false
trajectory_freeze_value_head = false

[eval]
eval_interval = 50
map_dir = "datasets/nuplanCarBostonAll_validation"
wosac_num_maps = 128
backend = PufferEnv
wosac_realism_eval = False
wosac_num_rollouts = 8
wosac_init_steps = 10
wosac_control_mode = "control_wosac"
wosac_init_mode = "create_all_valid"
wosac_goal_behavior = 2
wosac_goal_radius = 2.0
wosac_sanity_check = False
wosac_aggregate_results = True
human_replay_eval = False
human_replay_control_mode = "control_sdc_only"
human_replay_init_mode = "create_all_valid"
