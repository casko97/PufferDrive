[base]
package = ocean
env_name = puffer_drive
policy_name = Drive
rnn_name = Recurrent

[vec]
num_workers = 6
num_envs = 6
batch_size = 3
; backend = Serial

[policy]
input_size = 64
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[env]
num_agents = 1
action_type = discrete
dynamics_model = classic
reward_vehicle_collision = -0.5
reward_offroad_collision = -0.5
dt = 0.1
reward_goal = 1.0
reward_goal_post_respawn = 0.25
goal_radius = 2.0
goal_speed = 100.0
goal_behavior = 2
goal_target_distance = 30.0
collision_behavior = 1
offroad_behavior = 1
episode_length = 91
resample_frequency = 910
termination_mode = 1
map_dir = "resources/drive/binaries/nuplanCarBostonAll_validation"
num_maps = 4173
init_steps = 0
control_mode = "control_sdc_only"
observation_mode = "default"
sdc_runtime_truck_override = false
init_mode = "create_all_valid"
vision_range = 17


[train]
seed=42
total_timesteps = 2_000_000_000
; learning_rate = 0.02
; gamma = 0.985
anneal_lr = True
; Needs to be: num_agents * num_workers * BPTT horizon
batch_size =  393216 # 1024 * 6 * 32
minibatch_size = 24576 # =batch_size/16
max_minibatch_size = 32768
bptt_horizon = 32
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
clip_coef = 0.2
ent_coef = 0.005
gae_lambda = 0.95
gamma = 0.98
learning_rate = 0.003
max_grad_norm = 1
prio_alpha = 0.8499999999999999
prio_beta0 = 0.8499999999999999
update_epochs = 1
vf_clip_coef = 0.1999999999999999
vf_coef = 2
vtrace_c_clip = 1
vtrace_rho_clip = 1
checkpoint_interval = 1000
; Rendering options
render = False
render_interval = 1000
; If True, show exactly what the agent sees in agent observation
obs_only = True
; Show grid lines
show_grid = True
; Draws lines from ego agent observed ORUs and road elements to show detection range
show_lasers = False
; Display human xy logs in the background
show_human_logs = False
; If True, zoom in on a part of the map. Otherwise, show full map
zoom_in = True
; Options: List[str to path], str to path (e.g., "resources/drive/training/binaries/map_001.bin"), None
render_map = none

[eval]
eval_interval = 1000
map_dir = "datasets/nuplanCarBostonAll_validation"
wosac_num_maps = 4173
backend = PufferEnv
wosac_realism_eval = False
wosac_num_rollouts = 32
wosac_init_steps = 10
wosac_control_mode = "control_wosac"
wosac_init_mode = "create_all_valid"
wosac_goal_behavior = 2
wosac_goal_radius = 2.0
wosac_sanity_check = False
wosac_aggregate_results = True
human_replay_eval = True
human_replay_control_mode = "control_sdc_only"
