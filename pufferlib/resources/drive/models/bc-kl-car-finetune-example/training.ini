[base]
package = ocean
env_name = puffer_drive
policy_name = Drive
rnn_name = Recurrent

[policy]
input_size = 64
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[env]
action_type = discrete
dynamics_model = articulated
extend_classic_action_space = false
observation_mode = default
control_mode = "control_sdc_only"
init_mode = "create_all_valid"
map_dir = "/home/casko/phd-code/pufferdrive-kth/datasets/nuplanCarBostonAll_training"
num_maps = 37565

[train]
bptt_horizon = 32
batch_size = 393216
minibatch_size = 24576
max_minibatch_size = 32768
total_timesteps = 2000000000
device = "cuda"

[bc_kl]
enabled = true
model_path = "experiments_bc/bc-car-paired-offline-fits-direct/best.pt"
coef = 0.01
final_coef = 0.0
anneal_fraction = 1.0
temperature = 1.0
