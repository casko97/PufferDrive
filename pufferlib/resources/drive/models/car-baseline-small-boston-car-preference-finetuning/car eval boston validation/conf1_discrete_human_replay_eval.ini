[base]
package = ocean
env_name = puffer_drive
policy_name = Drive
rnn_name = Recurrent
load_model_path = "resources/drive/models/car-baseline-small-boston-car-preference-finetuning/puffer_drive_a8f41a07.pt"

[vec]
backend = Multiprocessing
num_workers = 6
num_envs = 6
batch_size = 3
seed = 42
zero_copy = True

[policy]
input_size = 64
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[env]
num_agents = 1
action_type = discrete
dynamics_model = classic
reward_vehicle_collision = -0.5
reward_offroad_collision = -0.5
dt = 0.1
reward_goal = 1.0
reward_goal_post_respawn = 0.25
goal_radius = 2.0
goal_speed = 100.0
goal_behavior = 2
goal_target_distance = 30.0
collision_behavior = 1
offroad_behavior = 1
episode_length = 91
resample_frequency = 910
termination_mode = 1
map_dir = "datasets/nuplanCarBostonAll_validation"
num_maps = 4173
scenario_filter = "all"
scenario_filter_threshold_deg = 45.0
scenario_filter_manifest_path = none
init_steps = 0
control_mode = "control_sdc_only"
observation_mode = "default"
init_mode = "create_all_valid"
vision_range = 17

[train]
seed = 42
total_timesteps = 2_000_000_000
anneal_lr = True
batch_size = 131072
minibatch_size = 8192
max_minibatch_size = 16384
bptt_horizon = 32
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
clip_coef = 0.2
ent_coef = 0.005
gae_lambda = 0.95
gamma = 0.98
learning_rate = 0.003
max_grad_norm = 1
prio_alpha = 0.8499999999999999
prio_beta0 = 0.8499999999999999
update_epochs = 1
vf_clip_coef = 0.1999999999999999
vf_coef = 2
vtrace_c_clip = 1
vtrace_rho_clip = 1
checkpoint_interval = 1000
render = False
render_interval = 1000
obs_only = True
show_grid = True
show_lasers = False
show_human_logs = False
zoom_in = True
render_map = none

[eval]
eval_interval = 1000
map_dir = "datasets/nuplanCarBostonAll_validation"
wosac_num_maps = 4173
backend = PufferEnv
wosac_realism_eval = False
wosac_num_rollouts = 32
wosac_init_steps = 10
wosac_control_mode = "control_wosac"
wosac_init_mode = "create_all_valid"
wosac_goal_behavior = 2
wosac_goal_radius = 2.0
wosac_sanity_check = False
wosac_aggregate_results = True
human_replay_eval = True
human_replay_control_mode = "control_sdc_only"

[preference_reward]
enabled = true
model_dir = "pufferlib/resources/drive/preferences/models/turning_all_90_10_30rounds_continue1"
checkpoint_stem = "offline_truck_context"
beta = 0.01
lambda_uncertainty = 0.0
normalize_mode = "zscore_baseline"
scale = 1.0
clip_min = -0.5
clip_max = 0.5
warmup_steps = 0
calibration_steps = 5000
log_member_stats = false
strict_observation_match = true

[sweep.train.learning_rate]
distribution = log_normal
min = 0.001
mean = 0.003
max = 0.005
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.001
mean = 0.005
max = 0.03
scale = auto

[sweep.train.gamma]
distribution = log_normal
min = 0.97
mean = 0.98
max = 0.999
scale = auto

[sweep.train.gae_lambda]
distribution = log_normal
min = 0.95
mean = 0.98
max = 0.999
scale = auto

[controlled_exp.train.goal_speed]
values = [10, 20, 30, 3]

[controlled_exp.train.ent_coef]
values = [0.001, 0.005, 0.01]

[controlled_exp.train.seed]
values = [42, 55, 1]
