[base]
package = ocean
env_name = puffer_drive
policy_name = Drive
rnn_name = Recurrent

[vec]
; Per-process settings.
num_workers = 4
num_envs = 4
batch_size = 2
backend = Multiprocessing
zero_copy = true

[policy]
input_size = 64
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[env]
; Keep the per-env agent budget at 2048 to avoid truncating dense scenes.
num_agents = 2048
; Options: discrete, continuous
action_type = discrete
; Options: classic, jerk
dynamics_model = classic
reward_vehicle_collision = -0.5
reward_offroad_collision = -0.5
dt = 0.1
reward_goal = 1.0
reward_goal_post_respawn = 0.25
; Meters around goal to be considered "reached"
goal_radius = 2.0
; Max target speed in m/s for the agent to maintain towards the goal
goal_speed = 100.0
; What to do when the goal is reached. Options: 0:"respawn", 1:"generate_new_goals", 2:"stop"
; Use stop to reduce intra-scene recycling and rely more on scene resampling across the large dataset.
goal_behavior = 0
; Determines the target distance to the new goal in the case of goal_behavior = generate_new_goals.
; Large numbers will select a goal point further away from the agent's current position.
goal_target_distance = 30.0
; Options: 0 - Ignore, 1 - Stop, 2 - Remove
; Stop agents on failure so PPO does not keep training on long post-failure rollouts.
collision_behavior = 0
; Options: 0 - Ignore, 1 - Stop, 2 - Remove
; Match collision handling: terminate the agent's rollout on off-road events.
offroad_behavior = 0
episode_length = 91
; Resample after each full episode so active maps rotate continuously through the full dataset.
resample_frequency = 910
; Let agent/world completion govern termination inside the horizon, while scene resampling still happens every 91 steps.
termination_mode = 0
; Point this at the full training set so resampling can cover the whole dataset over time.
map_dir = "/proj/rpl-soro/users/x_carsk/PufferDrive/binaries/nuplan_waymo_index"
; Active working set size sampled from the folder above. Increase to 512 only after confirming memory headroom.
num_maps = 256
; Random coverage over time, not deterministic sequential cycling.
sequential_map_sampling = False
; Determines which step of the trajectory to initialize the agents at upon reset
init_steps = 0
; Options: "control_vehicles", "control_agents", "control_wosac", "control_sdc_only"
control_mode = "control_vehicles"
; Options: "create_all_valid", "create_only_controlled"
init_mode = "create_all_valid"
observation_mode = "default"
sdc_runtime_truck_override = false

[train]
seed = 42
; Per-process budget. Run 4 seeds in parallel, one per GPU.
total_timesteps = 3_000_000_000
anneal_lr = False
; With num_agents=2048, num_workers=4, bptt_horizon=32:
; 2048 * 4 * 32 = 262144
batch_size = 262144
minibatch_size = 32768 #16384
max_minibatch_size = 32768
bptt_horizon = 32
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
clip_coef = 0.2
; Lower than the old baseline to avoid over-regularizing on the larger dataset.
ent_coef = 0.0005
gae_lambda = 0.95
gamma = 0.99
learning_rate = 0.003
max_grad_norm = 1
prio_alpha = 0.8499999999999999
prio_beta0 = 0.8499999999999999
; More than 1 epoch, but still conservative relative to standard PPO.
update_epochs = 2
vf_clip_coef = 0.2
vf_coef = 1.0
vtrace_c_clip = 1
vtrace_rho_clip = 1
compile = False
compile_fullgraph = False
compile_mode = reduce-overhead
checkpoint_interval = 1000
render = False
render_interval = 1000
obs_only = True
show_grid = True
show_lasers = False
show_human_logs = False
zoom_in = True
render_map = none

[eval]
eval_interval = 100
map_dir = "/proj/rpl-soro/users/x_carsk/PufferDrive/binaries/validation"
wosac_num_maps = 20
backend = PufferEnv
wosac_realism_eval = False
wosac_num_rollouts = 32
wosac_init_steps = 10
wosac_control_mode = "control_wosac"
wosac_init_mode = "create_all_valid"
wosac_goal_behavior = 2
wosac_goal_radius = 2.0
wosac_sanity_check = False
wosac_aggregate_results = True
human_replay_eval = False
human_replay_control_mode = "control_sdc_only"

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0002
mean = 0.0005
max = 0.001
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.0001
mean = 0.0005
max = 0.001
scale = auto

[sweep.train.gamma]
distribution = log_normal
min = 0.985
mean = 0.99
max = 0.995
scale = auto

[sweep.train.gae_lambda]
distribution = log_normal
min = 0.95
mean = 0.95
max = 0.98
scale = auto

[controlled_exp.train.goal_speed]
values = [10, 20, 30, 3]

[controlled_exp.train.ent_coef]
values = [0.0001, 0.0005, 0.001]

[controlled_exp.train.seed]
; Recommended 4-run launch on 4 GPUs
values = [42, 43, 44, 45]
