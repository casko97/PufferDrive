[base]
package = ocean
env_name = puffer_drive
policy_name = Drive
rnn_name = Recurrent

[vec]
num_workers = 4
num_envs = 4
batch_size = 2
backend = Multiprocessing
zero_copy = true

[policy]
input_size = 64
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[env]
num_agents = 1
action_type = discrete
dynamics_model = classic
reward_vehicle_collision = -0.5
reward_offroad_collision = -0.5
dt = 0.1
reward_goal = 1.0
reward_goal_post_respawn = 0.25
goal_radius = 2.0
goal_speed = 100.0
goal_behavior = 2
goal_target_distance = 30.0
collision_behavior = 1
offroad_behavior = 1
episode_length = 91
resample_frequency = 910
termination_mode = 1
map_dir = "resources/drive/binaries/training"
num_maps = 10000
sequential_map_sampling = 0
init_steps = 0
control_mode = "control_sdc_only"
init_mode = "create_all_valid"
observation_mode = "default"
sdc_runtime_truck_override = false

[train]
seed = 42
total_timesteps = 3000000000
anneal_lr = false
batch_size = 262144
minibatch_size = 32768
max_minibatch_size = 32768
bptt_horizon = 32
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
clip_coef = 0.2
ent_coef = 0.0005
gae_lambda = 0.95
gamma = 0.99
learning_rate = 0.003
max_grad_norm = 1
prio_alpha = 0.8499999999999999
prio_beta0 = 0.8499999999999999
update_epochs = 2
vf_clip_coef = 0.2
vf_coef = 1.0
vtrace_c_clip = 1
vtrace_rho_clip = 1
compile = false
compile_fullgraph = false
compile_mode = "reduce-overhead"
checkpoint_interval = 1000
render = false
render_interval = 1000
obs_only = true
show_grid = true
show_lasers = false
show_human_logs = false
zoom_in = true
render_map = none

[eval]
eval_interval = 100
map_dir = "resources/drive/binaries/validation"
; Match the apricot packaged eval behavior by sampling 100 maps from the
; full validation pool with seed 42 via the launcher flags.
wosac_num_maps = 10000
backend = PufferEnv
wosac_realism_eval = false
wosac_num_rollouts = 32
wosac_init_steps = 10
wosac_control_mode = "control_wosac"
wosac_init_mode = "create_all_valid"
wosac_goal_behavior = 2
wosac_goal_radius = 2.0
wosac_sanity_check = false
wosac_aggregate_results = true
human_replay_eval = true
human_replay_control_mode = "control_sdc_only"
